[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "headerguard"
version = "1.0.0"
description = "Audit HTTP security headers, cookies and CORS of a website and grade it A+..F (CI-friendly, zero dependencies)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ruslan Mustafaev" }]
keywords = ["security", "http-headers", "csp", "hsts", "cors", "pentest", "appsec", "ci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
headerguard = "headerguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["headerguard"]
